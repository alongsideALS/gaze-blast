<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#140c2d">
<meta name="description" content="Gaze Blast: an eye gaze training game for iPhone Eye Tracking.">
<style>body{margin:0}img{max-width:100%}</style>
<title>Gaze Blast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: one full-screen animated world per level. Canvas #bg paints the moving world; invisible <button> hit areas sit over each target so iPhone Dwell and Snap-to-Item work; canvas #fx draws the targets, the gaze tracer and the fireworks on top. Menus are glass cards. */
:root {
  --night: #140c2d;
  --ink: #fff8ef;
  --mist: #d9d0f2;
  --glass: rgba(22, 12, 48, .74);
  --line: rgba(255, 240, 220, .22);
  --sun: #ffd23f;
  --hot: #ff4fa3;
  --sky: #3de1ff;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--night); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.5; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#world { position: fixed; inset: 0; }
#world.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 10%,90% { translate: -3px 2px } 20%,80% { translate: 6px -3px } 30%,50%,70% { translate: -9px 4px } 40%,60% { translate: 9px -4px } }
#bg, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fx { pointer-events: none; z-index: 8; }
#stage { position: fixed; inset: 0; z-index: 1; }
.tgt { position: absolute; left: 0; top: 0; border: 0; padding: 0; background: transparent; border-radius: 50%; cursor: pointer; }
.tgt:focus-visible { outline: 3px solid var(--sun); }
#probe { position: fixed; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 4px; }

/* HUD */
#hud { position: fixed; left: 0; right: 0; top: 0; z-index: 9; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
#hud > * { pointer-events: auto; }
.hl { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.wname { font-family: var(--display); font-size: 17px; letter-spacing: .02em; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8), 0 0 10px rgba(0,0,0,.6); }
.score { font-family: var(--display); font-size: 34px; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 16px rgba(0,0,0,.4); }
.prog { height: 10px; border-radius: 99px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.25); overflow: hidden; max-width: 240px; }
.prog i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--hot), var(--sun)); transition: width .4s cubic-bezier(.2,.9,.2,1); }
.round-btn { width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(10,6,25,.5); display: grid; place-items: center; cursor: pointer; }
.round-btn svg { width: 24px; height: 24px; }
#streak { position: fixed; left: 50%; translate: -50% 0; top: calc(env(safe-area-inset-top, 0px) + 96px); z-index: 9; pointer-events: none; text-align: center;
  font-family: var(--display); line-height: .9; white-space: nowrap; }
#streak .n { display: block; font-size: 54px; color: #fff; text-shadow: 0 0 18px var(--glow, #ff4fa3), 0 3px 0 rgba(0,0,0,.35); }
#streak .w { display: block; font-size: 18px; letter-spacing: .08em; color: var(--glow, #ff4fa3); text-shadow: 0 0 10px rgba(0,0,0,.6); }
#streak.bump { animation: bump .35s cubic-bezier(.2,1.8,.4,1); }
@keyframes bump { 0% { scale: 1.6 } 100% { scale: 1 } }
#hint { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; pointer-events: none; text-align: center;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 16px; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
.chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: .05em; color: var(--mist); }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--mist); }
.chip.on { color: var(--sky); }
.chip.on::before { background: var(--sky); border-color: var(--sky); box-shadow: 0 0 10px var(--sky); }

/* Floating text */
#pops { position: fixed; inset: 0; z-index: 9; pointer-events: none; overflow: hidden; }
.pop { position: absolute; translate: -50% -50%; text-align: center; white-space: nowrap; font-family: var(--display); line-height: 1;
  animation: popup 1.5s cubic-bezier(.2,.9,.2,1) forwards; }
.pop .w { display: block; font-size: min(var(--fs, 44px), 12vw); color: #fff; -webkit-text-stroke: 2px rgba(0,0,0,.25);
  text-shadow: 0 0 22px var(--c, #ff4fa3), 0 4px 0 rgba(0,0,0,.3); }
.pop .s { display: block; margin-top: 6px; font-size: 26px; color: var(--sun); text-shadow: 0 0 12px rgba(0,0,0,.6); }
.pop .f { display: block; margin-top: 4px; font-size: 16px; letter-spacing: .1em; color: var(--sky); text-shadow: 0 0 10px rgba(0,0,0,.7); }
@keyframes popup { 0% { opacity: 0; scale: .3 } 14% { opacity: 1; scale: 1.18 } 28% { scale: 1 } 75% { opacity: 1 } 100% { opacity: 0; margin-top: -90px } }
.banner { position: absolute; left: 50%; top: 42%; translate: -50% -50%; text-align: center; font-family: var(--display); animation: banner 1.7s ease forwards; width: 90%; }
.banner .k { font-size: 18px; letter-spacing: .14em; color: var(--sun); }
.banner .t { font-size: clamp(40px, 12vw, 72px); line-height: 1; color: #fff; text-shadow: 0 0 26px var(--c, #ff4fa3), 0 4px 0 rgba(0,0,0,.3); text-wrap: balance; }
.banner .d { margin-top: 8px; font-family: var(--body); font-size: 17px; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
@keyframes banner { 0% { opacity: 0; scale: .6 } 15% { opacity: 1; scale: 1.05 } 25% { scale: 1 } 80% { opacity: 1 } 100% { opacity: 0 } }

/* Panels */
#layer { position: relative; z-index: 10; }
.scrim { position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto;
  padding-block: calc(env(safe-area-inset-top, 0px) + 24px) calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(10, 5, 25, .28); animation: fade .35s ease both; }
.scrim.test { place-items: end center; background: transparent; }
@keyframes fade { from { opacity: 0 } }
.card { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 18px; background: var(--glass); border: 1.5px solid var(--line); border-radius: 28px;
  backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); padding: 26px 20px; }
.eyebrow { font-family: var(--display); font-size: 15px; letter-spacing: .12em; color: var(--sun); }
h1, h2 { margin: 0; font-family: var(--display); font-weight: 400; line-height: .95; text-wrap: balance; }
h1 { font-size: clamp(64px, 20vw, 120px); background: linear-gradient(100deg, #ffd23f, #ff7a59 35%, #ff4fa3 60%, #8f7bff 85%, #3de1ff);
  -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
h2 { font-size: clamp(32px, 9vw, 46px); color: #fff; }
p { margin: 0; max-width: 62ch; }
.muted { color: var(--mist); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.btn { min-height: 70px; border-radius: 22px; border: 2px solid var(--line); background: rgba(255,255,255,.07); font-size: 20px; font-weight: 700; padding: 12px 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { font-family: var(--display); font-weight: 400; font-size: 26px; letter-spacing: .02em; color: #2b1200; border-color: transparent;
  background: linear-gradient(180deg, #fff1a6, #ffd23f 40%, #ff9b3d); box-shadow: 0 6px 0 #b45f12, 0 10px 28px rgba(255,160,60,.4); }
.btn.alt { border-color: var(--hot); background: rgba(255,79,163,.18); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.wcard { border-radius: 20px; border: 2px solid var(--line); background: rgba(255,255,255,.06); padding: 10px 10px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.wcard canvas { width: 92px; height: 92px; }
.wcard .t { font-family: var(--display); font-size: 18px; line-height: 1.05; }
.wcard .s { font-size: 18px; letter-spacing: .1em; color: var(--sun); min-height: 1.4em; }
.wcard .n { font-size: 12px; letter-spacing: .1em; color: var(--mist); }
.wcard[disabled] { opacity: .55; cursor: default; }
.wcard.cur { border-color: var(--sun); box-shadow: 0 0 18px rgba(255,210,63,.35); }
.skills { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.skills .btn { min-height: 64px; font-family: var(--display); font-weight: 400; font-size: 26px; padding: 4px; }
.skills .btn[aria-pressed="true"] { border-color: var(--sun); background: rgba(255,210,63,.2); color: var(--sun); box-shadow: 0 0 16px rgba(255,210,63,.35); }
.spec { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.spec div { border-radius: 14px; background: rgba(255,255,255,.06); padding: 10px 12px; min-width: 0; }
.spec b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; color: #fff; }
.spec span { font-size: 13px; color: var(--mist); }
.seg { display: grid; gap: 10px; }
.seg .btn { min-height: 62px; font-size: 17px; padding: 6px; }
.seg .btn[aria-pressed="true"] { border-color: var(--sun); background: rgba(255,210,63,.18); color: var(--sun); }
.label { font-family: var(--display); font-size: 14px; letter-spacing: .1em; color: var(--mist); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stats div { border-radius: 16px; background: rgba(255,255,255,.07); padding: 12px; text-align: center; min-width: 0; }
.stats b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 8vw, 36px); line-height: 1.05; color: #fff; font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; color: var(--mist); }
.stars { display: flex; justify-content: center; gap: 10px; font-size: 56px; line-height: 1; }
.stars span { color: rgba(255,255,255,.18); }
.stars span.on { color: var(--sun); text-shadow: 0 0 20px rgba(255,210,63,.8); animation: bump .5s cubic-bezier(.2,1.8,.4,1) both; }
.badge { align-self: center; font-family: var(--display); font-size: 16px; letter-spacing: .06em; color: #2b1200; background: var(--sun); border-radius: 99px; padding: 6px 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { font-family: var(--display); font-size: 16px; padding: 6px 12px; border-radius: 99px; background: rgba(255,255,255,.1); border: 1px solid var(--line); }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 12px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; }
ol.steps li::before { content: counter(s); width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--sun); color: var(--sun); display: grid; place-items: center; font-family: var(--display); }
.path { font-weight: 700; color: var(--sun); }
@media (prefers-reduced-motion: reduce) { .pop, .banner, #streak.bump, .stars span.on, .scrim { animation-duration: .01s !important; } }
</style>
</head>
<body>


<div id="world">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="stage" aria-label="Play area"></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="probe"></div>
<div id="hud" hidden>
  <div class="hl"><div class="wname" id="wName"></div><div class="score" id="score">0</div><div class="prog"><i id="progFill"></i></div></div>
  <button class="round-btn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg></button>
</div>
<div id="streak" hidden><span class="n"></span><span class="w"></span></div>
<div id="hint" hidden><span id="hintTxt"></span><span class="chip" id="gazeChip">Hold your gaze to hit</span></div>
<div id="pops"></div>
<div id="layer"></div>

<script>
(() => {
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);

/* ============ Worlds ============ */
const WORLDS = [
  { name: 'Sunflower Field', thing: 'sunflower', spr: 'sunflower', bg: 'sun', fx: 'petal', words: ['Bloom!', 'Sunny!', 'Blossom!'], pal: ['#ffd23f', '#ff9b1c', '#fff27a', '#ff6b6b', '#8fe36b'] },
  { name: 'Night Game', thing: 'baseball', spr: 'baseball', bg: 'ball', fx: 'ball', words: ['Home run!', 'Strike!', 'Grand slam!'], pal: ['#ffffff', '#ff3b3b', '#ffd23f', '#5ab0ff', '#b6f0ff'] },
  { name: 'Dachshund Park', thing: 'dachshund', spr: 'dachshund', bg: 'dog', fx: 'heart', words: ['Good dog!', 'Wiggle!', 'Woof!'], pal: ['#ff6fae', '#ffd23f', '#ff9f6b', '#ffffff', '#ff4f6d'] },
  { name: 'Deep Sea', thing: 'jellyfish', spr: 'jellyfish', bg: 'sea', fx: 'bubble', words: ['Splash!', 'Glow!', 'Swish!'], pal: ['#5ef2ff', '#b48cff', '#ff7ad9', '#7dffb2', '#ffffff'] },
  { name: 'Donut Shop', thing: 'donut', spr: 'donut', bg: 'candy', fx: 'sprinkle', words: ['Sweet!', 'Sprinkles!', 'Yum!'], pal: ['#ff7eb6', '#ffd23f', '#5ef2ff', '#7dffb2', '#b48cff'] },
  { name: 'Ringed Planets', thing: 'planet', spr: 'planet', bg: 'space', fx: 'star', words: ['Supernova!', 'Liftoff!', 'Cosmic!'], pal: ['#ffb347', '#ff6bd6', '#8f7bff', '#3de1ff', '#ffffff'] },
  { name: 'Butterfly Garden', thing: 'butterfly', spr: 'butterfly', bg: 'garden', fx: 'wing', words: ['Flutter!', 'Lovely!', 'Beautiful!'], pal: ['#ff8c42', '#ffe066', '#5ef2ff', '#d6336c', '#7a5cff'] },
  { name: 'Balloon Festival', thing: 'hot air balloon', spr: 'balloon', bg: 'balloons', fx: 'confetti', words: ['Up, up!', 'Soaring!', 'Lift off!'], pal: ['#ff4f5e', '#ffd23f', '#3de1ff', '#7dffb2', '#b48cff'] },
  { name: 'Northern Lights', thing: 'snowflake', spr: 'snowflake', bg: 'aurora', fx: 'flake', words: ['Dazzling!', 'Ice cold!', 'Sparkle!'], pal: ['#bff3ff', '#7dffb2', '#8f7bff', '#3de1ff', '#ffffff'] },
  { name: 'Neon Nights', thing: 'disco ball', spr: 'disco', bg: 'neon', fx: 'spark', words: ['Groovy!', 'Electric!', 'Dance!'], pal: ['#ff3df0', '#3de1ff', '#ffe14f', '#7dff6a', '#ffffff'] },
];
const COMBO = [[25, 'BEYOND LEGENDARY'], [18, 'LEGENDARY'], [13, 'UNSTOPPABLE'], [9, 'INCREDIBLE'], [6, 'AMAZING'], [4, 'GREAT'], [2, 'NICE']];
const comboWord = s => (COMBO.find(([n]) => s >= n) || [0, ''])[1];
// Skill 1..10: target radius, hold time, drift speed, time limit, decoys, gap between targets
const SK = {
  r:      [78, 70, 63, 57, 51, 46, 42, 38, 34, 31],
  dwell:  [1.4, 1.25, 1.1, 1.0, .9, .8, .72, .65, .58, .5],
  speed:  [0, 0, 18, 30, 45, 60, 75, 90, 105, 120],
  life:   [0, 0, 0, 7, 6, 5, 4.5, 4, 3.5, 3],
  decoys: [0, 0, 0, 0, 1, 1, 2, 2, 3, 3],
  gap:    [900, 800, 700, 620, 540, 470, 410, 360, 310, 260],
};
const skill = k => ({ r: SK.r[k - 1], dwell: SK.dwell[k - 1] + (settings.hold === 'longer' ? .5 : 0), speed: SK.speed[k - 1], life: SK.life[k - 1], decoys: SK.decoys[k - 1], gap: SK.gap[k - 1] });
const PER_ROUND = 12, REST_AFTER = 15 * 60;

/* ============ Storage ============ */
const store = {
  get(k, d) { try { const v = localStorage.getItem('gazeblast.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('gazeblast.' + k, JSON.stringify(v)); } catch {} },
};
const settings = Object.assign({ sound: true, motion: 'full', tracer: 'long', hold: 'auto' }, store.get('settings', {}));
const prog = Object.assign({ skill: 1, unlocked: 1, stars: {}, best: {}, bestStreak: 0, world: 0 }, store.get('prog', {}));
const save = () => store.set('prog', prog);
const calm = () => settings.motion === 'calm' || matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ Audio ============ */
let ac = null, master = null, noiseBuf = null;
function audio() {
  if (!settings.sound) return null;
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = .6;
      const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch { return null; }
}
function tone(f, dur, type, vol, when = 0, to) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
function noise(dur, vol, type, f0, f1, when = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + when, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + .05);
}
const note = s => 392 * Math.pow(2, s / 12);
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];
function boom(p, when = 0) { noise(.8 + p * .15, .32 + p * .05, 'lowpass', 1000, 60, when); tone(95, .45, 'sine', .22, when, 38); }
function crackle(n, when = 0) { for (let i = 0; i < n; i++) noise(.035, .06, 'highpass', 3500, null, when + .25 + Math.random() * 1.1); }
function chime(streak) { const b = Math.min(streak - 1, PENTA.length - 4); [0, 1, 2, 3].forEach(i => tone(note(PENTA[b + i] + 12), .5, 'triangle', .07, i * .06)); }
function missSound() { tone(330, .3, 'sine', .08, 0, 180); }

/* ============ Canvas setup ============ */
const bg = $('bg'), ctx = bg.getContext('2d'), fxc = $('fx'), fx = fxc.getContext('2d'), probe = $('probe');
let W = 0, H = 0, DPR = 1, stars = [];
function insets() { const cs = getComputedStyle(probe); return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 }; }
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  for (const [c, x] of [[bg, ctx], [fxc, fx]]) { c.width = W * DPR; c.height = H * DPR; x.setTransform(DPR, 0, 0, DPR, 0, 0); }
  stars = Array.from({ length: Math.round(W * H / 3000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: .4 + Math.random() * 1.2, p: Math.random() * TAU }));
  initBG(curWorld);
}
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }

function spriteThumb(cv, i, locked) {
  const c = cv.getContext('2d'), d = Math.min(window.devicePixelRatio || 1, 2); cv.width = 92 * d; cv.height = 92 * d; c.scale(d, d);
  c.translate(46, 46); if (locked) c.globalAlpha = .25; SPR[WORLDS[i].spr](c, 36, .22);
}
const ROUTES = {
  home() {
    endGame(); initBG(prog.world || 0);
    const wi = Math.min(prog.unlocked - 1, 9), cont = prog.world && prog.world < prog.unlocked ? prog.world : wi;
    show(`<div class="card stack">
      <div class="eyebrow">Eye gaze training for iPhone</div>
      <h1>Gaze Blast</h1>
      <p class="muted">Look at the target and hold your gaze to blast it into fireworks. Hit them faster, in a row, and the show gets bigger.</p>
      <div class="row"><span class="pill">Skill ${prog.skill}</span><span class="pill">Best streak ${prog.bestStreak}</span><span class="pill">${Object.values(prog.stars).reduce((a, b) => a + b, 0)} ★</span></div>
      <div class="stack">
        <button class="btn primary" data-go="round" data-arg="${cont}">Play ${WORLDS[cont].name}</button>
        <div class="grid2"><button class="btn" data-go="worlds">Worlds</button><button class="btn" data-go="skill">Skill level</button></div>
        <div class="grid2"><button class="btn" data-go="setup">Set up Eye Tracking</button><button class="btn" data-go="settings">Settings</button></div>
      </div>
      <p class="muted" style="font-size:15px">Move your eyes around. The tracer follows your gaze.</p>
    </div>`);
  },
  round(i) { startRound(+i); },
  worlds() {
    endGame();
    show(`<div class="card stack"><div class="eyebrow">Ten worlds</div><h2>Choose a world</h2>
      <div class="worlds">${WORLDS.map((w, i) => { const locked = i >= prog.unlocked, s = prog.stars[i] || 0;
        return `<button class="wcard ${i === prog.world ? 'cur' : ''}" ${locked ? 'disabled' : `data-go="round" data-arg="${i}"`}><canvas data-i="${i}" data-l="${locked ? 1 : 0}"></canvas><span class="n">WORLD ${i + 1}</span><span class="t">${w.name}</span><span class="s">${locked ? 'Locked' : '★'.repeat(s) + '☆'.repeat(3 - s)}</span></button>`; }).join('')}</div>
      <p class="muted" style="font-size:15px">Clear a world to unlock the next one.</p>
      <button class="btn" data-go="home">Back</button></div>`, el => el.querySelectorAll('canvas').forEach(cv => spriteThumb(cv, +cv.dataset.i, cv.dataset.l === '1')));
  },
  skill() {
    endGame();
    const spec = k => { const s = skill(k); return `<div><b>${Math.round(s.r * 2)} px</b><span>target size</span></div><div><b>${s.dwell.toFixed(2)} s</b><span>hold to hit</span></div><div><b>${s.speed ? ['Slow', 'Slow', 'Steady', 'Steady', 'Quick', 'Quick', 'Fast', 'Fast'][Math.min(7, Math.floor(s.speed / 16))] : 'Still'}</b><span>target movement</span></div><div><b>${s.life ? s.life + ' s' : 'None'}</b><span>time limit</span></div><div><b>${s.decoys}</b><span>faded decoys</span></div><div><b>${Math.round(s.r * 2 / SK.r[0] / 2 * 100)}%</b><span>size vs. skill 1</span></div>`; };
    show(`<div class="card stack"><div class="eyebrow">Skill level</div><h2>Where are you now?</h2>
      <p class="muted">Higher skill means smaller, faster targets, shorter holds, time limits and decoys to ignore. Raise it when a world feels easy.</p>
      <div class="skills">${Array.from({ length: 10 }, (_, i) => `<button class="btn" data-k="${i + 1}" aria-pressed="${prog.skill === i + 1}">${i + 1}</button>`).join('')}</div>
      <div class="spec" id="spec">${spec(prog.skill)}</div>
      <button class="btn primary" data-go="home">Done</button></div>`, el => {
      el.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
        audio(); prog.skill = +b.dataset.k; save(); tone(note(prog.skill * 2), .12, 'triangle', .06);
        el.querySelectorAll('[data-k]').forEach(x => x.setAttribute('aria-pressed', x === b)); el.querySelector('#spec').innerHTML = spec(prog.skill);
      }));
    });
  },
  setSkill(k) { prog.skill = Math.max(1, Math.min(10, +k)); save(); ROUTES.skill(); },
  setup() {
    endGame();
    show(`<div class="card stack"><div class="eyebrow">Before you play</div><h2>Set up Eye Tracking</h2>
      <p class="muted">Eye Tracking is built into iOS 18 and later on recent iPhones. It moves a pointer with your eyes, and holding still (dwelling) taps.</p>
      <ol class="steps">
        <li><span>Set iPhone on a stable mount about a foot and a half from the face.</span></li>
        <li><span>Open <span class="path">Settings › Accessibility › Eye Tracking</span> and turn it on.</span></li>
        <li><span>Follow the dot with your eyes to calibrate. Calibrate again whenever the phone or head moves.</span></li>
        <li><span>Leave <span class="path">Dwell Control</span> on. If the pointer feels jumpy, raise <span class="path">Smoothing</span>.</span></li>
        <li><span>Open this page in Safari.</span></li>
      </ol>
      <div class="stack"><button class="btn primary" data-go="test">Test the tracer</button><button class="btn" data-go="home">Done</button></div></div>`);
  },
  test() {
    endGame();
    show(`<div class="card stack" style="max-width:460px"><div class="eyebrow">Tracer check</div>
      <p id="testStatus">${gaze.seen ? 'The tracer is following your eyes. You are ready.' : 'Look around the screen. A rainbow tracer should follow your eyes.'}</p>
      <button class="btn primary" data-go="setup">Done</button></div>`, el => el.classList.add('test'));
    clearTimeout(testTimer);
    testTimer = setTimeout(() => { const t = $('testStatus'); if (t && !gaze.seen) t.textContent = "No eye position is reaching this page yet. Check that Eye Tracking is on and calibrated. Targets still pop with the iPhone's own dwell, but the tracer won't show."; }, 9000);
  },
  settings() {
    endGame();
    const seg = (key, opts) => `<div class="seg" style="grid-template-columns:repeat(${opts.length},1fr)">${opts.map(([v, t]) => `<button class="btn" data-set="${key}" data-val="${v}" aria-pressed="${settings[key] === v}">${t}</button>`).join('')}</div>`;
    show(`<div class="card stack"><div class="eyebrow">Settings</div><h2>Make it comfortable</h2>
      <div class="stack"><div class="label">GAZE TRACER</div>${seg('tracer', [['long', 'Long'], ['short', 'Short'], ['off', 'Off']])}</div>
      <div class="stack"><div class="label">HOLD TIME</div>${seg('hold', [['auto', 'Set by skill'], ['longer', 'Extra ½ second']])}</div>
      <div class="stack"><div class="label">SOUND</div>${seg('sound', [[true, 'On'], [false, 'Off']])}</div>
      <div class="stack"><div class="label">MOTION</div>${seg('motion', [['full', 'Full'], ['calm', 'Calm']])}</div>
      <button class="btn" id="resetBtn">Reset progress</button>
      <button class="btn primary" data-go="home">Done</button></div>`, el => {
      el.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => {
        const k = b.dataset.set; let v = b.dataset.val; if (v === 'true') v = true; if (v === 'false') v = false;
        settings[k] = v; store.set('settings', settings); el.querySelectorAll(`[data-set="${k}"]`).forEach(x => x.setAttribute('aria-pressed', x === b));
        if (k === 'sound' && v) chime(3);
      }));
      const r = el.querySelector('#resetBtn'); let armed = false;
      r.addEventListener('click', () => { if (!armed) { armed = true; r.textContent = 'Select again to erase stars and worlds'; return; }
        Object.assign(prog, { skill: 1, unlocked: 1, stars: {}, best: {}, bestStreak: 0, world: 0 }); save(); r.textContent = 'Progress reset'; r.disabled = true; });
    });
  },
  pause() {
    const G = game; if (!G) return; G.paused = true;
    show(`<div class="card stack"><div class="eyebrow">Paused</div><h2>${WORLDS[G.wi].name}</h2>
      <div class="stats"><div><b>${G.hits}/${PER_ROUND}</b><span>hits</span></div><div><b>${G.best}</b><span>best streak</span></div></div>
      <div class="stack"><button class="btn primary" id="resumeBtn">Resume</button><div class="grid2"><button class="btn" data-go="worlds">Worlds</button><button class="btn" data-go="home">Home</button></div></div></div>`,
      el => el.querySelector('#resumeBtn').addEventListener('click', () => { closePanels(); G.paused = false; }));
  },
  rest() {
    const G = game; if (!G) return; G.paused = true; G.playT = 0;
    show(`<div class="card stack"><div class="eyebrow">Rest break</div><h2>Rest your eyes</h2>
      <p>Fifteen minutes of fast aiming tires the eye muscles, and tired eyes aim worse. Close your eyes or look far away for a minute.</p>
      <button class="btn primary" id="restBtn" disabled>Rest 60</button><button class="btn" data-go="home">Stop for now</button></div>`, el => {
      const b = el.querySelector('#restBtn'); let s = 60;
      const iv = setInterval(() => { if (!document.body.contains(b)) return clearInterval(iv); s--; b.textContent = s > 0 ? `Rest ${s}` : 'Back to it'; if (s <= 0) { clearInterval(iv); b.disabled = false; chime(5); } }, 1000);
      b.addEventListener('click', () => { closePanels(); G.paused = false; spawn(); });
    });
  },
};

addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch {}
ROUTES.home();
})();
</script>

</body>
</html>
